<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ff">
  <title>Góc kỷ niệm</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24213a;
      background: #f8f7fc;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 8% 0, #eae6ff 0, transparent 34%),
        radial-gradient(ellipse at 95% 95%, #e1f4ef 0, transparent 32%),
        #f8f7fc;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .page {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 46px 24px 64px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: #7567db;
      font-size: .75rem;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -.05em;
    }

    .subtitle {
      max-width: 550px;
      margin: 10px 0 0;
      color: #77758a;
      line-height: 1.65;
    }

    .logout {
      flex: 0 0 auto;
      padding: 10px 15px;
      border: 1px solid #e5e2ef;
      border-radius: 11px;
      color: #514d68;
      background: #ffffffc9;
      text-decoration: none;
      font-size: .9rem;
      font-weight: 650;
    }

    .header-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 10px;
    }

    .plans-link {
      padding: 10px 15px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      background: linear-gradient(100deg, #7869e8, #6454d8);
      text-decoration: none;
      font-size: .9rem;
      font-weight: 700;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .memory-card {
      overflow: hidden;
      padding: 0;
      border: 1px solid #ffffff;
      border-radius: 18px;
      text-align: left;
      color: inherit;
      background: #fff;
      box-shadow: 0 10px 30px #312e5b0d;
      transition: transform .2s, box-shadow .2s;
    }

    .memory-card:hover, .memory-card:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 16px 35px #312e5b18;
    }

    .photo {
      position: relative;
      display: grid;
      aspect-ratio: 4 / 3;
      place-items: center;
      overflow: hidden;
      color: #746c99;
      background:
        radial-gradient(ellipse at 75% 25%, #fff9 0, transparent 26%),
        linear-gradient(140deg, #e7e2ff, #dcefed);
    }

    .photo::before, .photo::after {
      position: absolute;
      bottom: -30%;
      width: 76%;
      height: 75%;
      border-radius: 50% 50% 0 0;
      content: "";
      background: #ffffff55;
    }

    .photo::before { left: -20%; }
    .photo::after { right: -24%; background: #aaa1e52b; }

    .photo img {
      position: absolute;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-placeholder {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      gap: 7px;
      color: #69628b;
      font-size: .82rem;
    }

    .photo-placeholder span:first-child { font-size: 1.6rem; }

    .card-copy { padding: 14px 15px 16px; }

    .card-date {
      display: block;
      min-height: 1.2em;
      margin-bottom: 5px;
      color: #8378d8;
      font-size: .75rem;
      font-weight: 700;
    }

    .card-title {
      display: block;
      overflow: hidden;
      font-size: .95rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-description {
      display: -webkit-box;
      overflow: hidden;
      min-height: 2.8em;
      margin-top: 6px;
      color: #858294;
      font-size: .82rem;
      line-height: 1.45;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .dialog {
      width: min(1100px, calc(100% - 28px));
      max-height: 96vh;
      padding: 0;
      overflow: auto;
      border: 1px solid #fff;
      border-radius: 22px;
      color: #24213a;
      background: #fff;
      box-shadow: 0 25px 80px #17142d40;
    }

    .dialog::backdrop { background: #17142d88; backdrop-filter: blur(4px); }

    .dialog-photo {
      position: relative;
      display: grid;
      min-height: 210px;
      max-height: 45vh;
      aspect-ratio: 16 / 9;
      place-items: center;
      overflow: hidden;
      color: #746c99;
      background: linear-gradient(140deg, #e7e2ff, #dcefed);
    }

    .dialog-photo.has-image {
      min-height: 0;
      max-height: 80vh;
      aspect-ratio: auto;
      background: #24213a;
    }

    .dialog-photo img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #24213a;
    }

    .dialog-photo.has-image img {
      position: static;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 80vh;
    }

    .dialog-photo.has-image .dialog-placeholder { display: none; }
    .dialog-placeholder { text-align: center; }
    .dialog-placeholder span { display: block; margin-bottom: 8px; font-size: 2rem; }

    .close {
      position: absolute;
      z-index: 2;
      top: 12px;
      right: 12px;
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #69667a;
      background: #ffffffeb;
      box-shadow: 0 2px 8px #17142d30;
      font-size: 1.25rem;
    }

    @media (max-width: 850px) {
      .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    }

    @media (max-width: 600px) {
      .page { padding: 32px 16px 48px; }
      header { align-items: flex-start; }
      .header-actions { flex-direction: column; align-items: stretch; }
      .logout, .plans-link { padding: 9px 11px; text-align: center; font-size: .82rem; }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .card-copy { padding: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">Album của bạn</p>
        <h1>Góc kỷ niệm</h1>
        <p class="subtitle">Chọn một khung để xem ảnh và kỷ niệm đã lưu.</p>
      </div>
      <nav class="header-actions" aria-label="Điều hướng">
        <a class="plans-link" href="du-dinh.html">Dự định tương lai</a>
        <a class="logout" href="index.html">Đăng xuất</a>
      </nav>
    </header>

    <section class="gallery" id="gallery" aria-label="10 ảnh kỷ niệm"></section>
  </main>

  <dialog class="dialog" id="memory-dialog" aria-label="Ảnh kỷ niệm">
    <div class="dialog-photo" id="dialog-photo">
      <img id="dialog-image" alt="">
      <div class="dialog-placeholder"><span aria-hidden="true">✦</span>Chưa có ảnh — hãy chọn ảnh của bạn</div>
      <button class="close" id="close-dialog" type="button" aria-label="Đóng">×</button>
    </div>
  </dialog>

  <script>
    const DB_NAME = "memory-gallery";
    const STORE_NAME = "memories";
    const DEFAULT_IMAGES = [
      "ky-niem-01.jpeg",
      "ky-niem-02.jpg",
      "ky-niem-10.jpg",
      "ky-niem-09.jpg",
      "ky-niem-05.jpg",
      "ky-niem-08.jpg",
      "ky-niem-06.jpg",
      "ky-niem-07.jpg",
      "ky-niem-03.jpg",
      "ky-niem-04.jpg"
    ];
    const DEFAULT_MEMORIES = [
      { date: "2025-02-23", title: "Ngày kỉ yếu", text: "Ngày kỉ yếu" },
      { date: "2026-05-09", title: "MusicBox", text: "MusicBox" },
      { date: "2026-05-12", title: "Đi chạy", text: "Đi chạy" },
      { date: "2026-06-09", title: "Bắt mũ", text: "Bắt mũ" },
      { date: "2026-06-26", title: "Photobooth đầu tiên", text: "Photobooth đầu tiên" },
      { date: "2026-06-27", title: "Hội Khám", text: "Hội Khám" },
      { date: "2026-07-10", title: "Sinh nhật lanbe", text: "Sinh nhật lanbe" },
      { date: "2026-08-09", title: "Checkin thang máy", text: "Checkin thang máy" },
      { date: "2026-09-25", title: "Nhà thờ lớn", text: "Nhà thờ lớn" },
      { date: "2026-10-16", title: "Rạp xem phim", text: "Rạp xem phim" }
    ];
    const gallery = document.querySelector("#gallery");
    const dialog = document.querySelector("#memory-dialog");
    const dialogPhoto = document.querySelector("#dialog-photo");
    const dialogImage = document.querySelector("#dialog-image");
    let database;

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 2);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(STORE_NAME)) {
            request.result.createObjectStore(STORE_NAME, { keyPath: "id" });
          }
          if (!request.result.objectStoreNames.contains("future-plans")) {
            request.result.createObjectStore("future-plans", { keyPath: "id", autoIncrement: true });
          }
        };
        request.onsuccess = () => {
          request.result.onversionchange = () => request.result.close();
          resolve(request.result);
        };
        request.onerror = () => reject(request.error);
      });
    }

    function getMemory(id) {
      return new Promise((resolve, reject) => {
        const request = database.transaction(STORE_NAME).objectStore(STORE_NAME).get(id);
        request.onsuccess = () => resolve(request.result || {});
        request.onerror = () => reject(request.error);
      });
    }

    function updateImagePreview(image, fallbackImage) {
      if (dialogImage.src.startsWith("blob:")) URL.revokeObjectURL(dialogImage.src);
      if (image) {
        dialogImage.src = URL.createObjectURL(image);
        dialogPhoto.classList.add("has-image");
      } else if (fallbackImage) {
        dialogImage.src = fallbackImage;
        dialogPhoto.classList.add("has-image");
      } else {
        dialogImage.removeAttribute("src");
        dialogPhoto.classList.remove("has-image");
      }
    }

    async function renderGallery() {
      const memories = await Promise.all(
        Array.from({ length: 10 }, (_, index) => getMemory(index))
      );
      gallery.replaceChildren();

      memories
        .map((memory, index) => {
          const defaults = DEFAULT_MEMORIES[index];
          return {
            memory: {
              ...defaults,
              ...memory,
              date: memory.date || defaults.date,
              title: memory.title || defaults.title,
              text: memory.text || defaults.text
            },
            index
          };
        })
        .sort((a, b) => {
          if (!a.memory.date) return b.memory.date ? 1 : a.index - b.index;
          if (!b.memory.date) return -1;
          return a.memory.date.localeCompare(b.memory.date) || a.index - b.index;
        })
        .forEach(({ memory, index }) => {
        const card = document.createElement("button");
        card.className = "memory-card";
        card.type = "button";
        card.setAttribute("aria-label", `Mở kỷ niệm số ${index + 1}`);

        const photo = document.createElement("span");
        photo.className = "photo";
        if (memory.image || DEFAULT_IMAGES[index]) {
          const image = document.createElement("img");
          image.src = memory.image ? URL.createObjectURL(memory.image) : DEFAULT_IMAGES[index];
          image.alt = memory.title ? `Ảnh: ${memory.title}` : `Ảnh kỷ niệm số ${index + 1}`;
          photo.append(image);
        } else {
          const placeholder = document.createElement("span");
          placeholder.className = "photo-placeholder";
          placeholder.innerHTML = `<span aria-hidden="true">✦</span><span>Chưa có ảnh</span>`;
          photo.append(placeholder);
        }

        const copy = document.createElement("span");
        copy.className = "card-copy";
        const date = document.createElement("span");
        date.className = "card-date";
        date.textContent = memory.date || "Chưa thêm thời gian";
        const title = document.createElement("span");
        title.className = "card-title";
        title.textContent = memory.title || `Kỷ niệm ${String(index + 1).padStart(2, "0")}`;
        const description = document.createElement("span");
        description.className = "card-description";
        description.textContent = memory.text || "Nhấn để xem ảnh.";
        copy.append(date, title, description);
        card.append(photo, copy);
        card.addEventListener("click", () => openMemory(index));
        gallery.append(card);
      });
    }

    async function openMemory(index) {
      const memory = await getMemory(index);
      updateImagePreview(memory.image, DEFAULT_IMAGES[index]);
      dialog.showModal();
    }

    document.querySelector("#close-dialog").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", event => {
      if (event.target === dialog) dialog.close();
    });

    openDatabase()
      .then(async result => {
        database = result;
        await renderGallery();
      })
      .catch(error => {
        document.querySelector(".subtitle").textContent =
          "Không thể mở bộ nhớ kỷ niệm trên trình duyệt này. Hãy thử bằng Chrome hoặc Edge.";
        console.error("Không thể mở bộ nhớ kỷ niệm:", error);
      });
  </script>
</body>
</html>
