<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ff">
  <title>Dự định tương lai</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24213a;
      background: #f8f7fc;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 8% 0, #eae6ff 0, transparent 34%),
        radial-gradient(ellipse at 95% 95%, #e1f4ef 0, transparent 32%),
        #f8f7fc;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .page {
      width: min(940px, 100%);
      margin: 0 auto;
      padding: 46px 24px 64px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: #7567db;
      font-size: .75rem;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -.05em;
    }

    .subtitle {
      max-width: 570px;
      margin: 10px 0 0;
      color: #77758a;
      line-height: 1.65;
    }

    .header-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 10px;
    }

    .nav-link {
      flex: 0 0 auto;
      padding: 10px 15px;
      border: 1px solid #e5e2ef;
      border-radius: 11px;
      color: #514d68;
      background: #ffffffc9;
      text-decoration: none;
      font-size: .9rem;
      font-weight: 650;
    }

    .nav-link.primary {
      border: 0;
      color: #fff;
      background: linear-gradient(100deg, #7869e8, #6454d8);
    }

    .plan-form {
      display: grid;
      grid-template-columns: 1fr 190px;
      gap: 16px;
      margin-bottom: 28px;
      padding: 24px;
      border: 1px solid #fff;
      border-radius: 20px;
      background: #ffffffed;
      box-shadow: 0 12px 35px #312e5b0d;
    }

    .field { min-width: 0; }
    .field label {
      display: block;
      margin-bottom: 7px;
      color: #48455b;
      font-size: .88rem;
      font-weight: 700;
    }

    .field input, .field textarea {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      border: 1px solid #e4e2ed;
      border-radius: 11px;
      outline: none;
      color: #24213a;
      background: #fff;
    }

    .field textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
    .field input:focus, .field textarea:focus {
      border-color: #7869e8;
      box-shadow: 0 0 0 4px #7869e81c;
    }

    .description-field { grid-column: 1 / -1; }

    .submit {
      grid-column: 1 / -1;
      min-height: 48px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      background: linear-gradient(100deg, #7869e8, #6454d8);
      font-weight: 700;
    }

    .plans-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 14px;
    }

    h2 { margin: 0; font-size: 1.35rem; letter-spacing: -.03em; }
    .count { color: #858294; font-size: .85rem; }

    .plan-list { display: grid; gap: 12px; }

    .plan-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: start;
      gap: 14px;
      padding: 17px 18px;
      border: 1px solid #fff;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 24px #312e5b0a;
    }

    .plan-card.completed { opacity: .68; }

    .plan-check {
      width: 19px;
      height: 19px;
      margin: 3px 0 0;
      accent-color: #7162e5;
    }

    .plan-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 750;
    }

    .completed .plan-title { text-decoration: line-through; }

    .plan-date {
      display: inline-block;
      margin-top: 5px;
      color: #7669d7;
      font-size: .8rem;
      font-weight: 700;
    }

    .plan-notes {
      margin: 8px 0 0;
      color: #77758a;
      font-size: .9rem;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .delete {
      padding: 7px 10px;
      border: 1px solid #eeeaf2;
      border-radius: 9px;
      color: #8d5360;
      background: #fff;
      font-size: .82rem;
      font-weight: 650;
    }

    .empty, .error {
      padding: 28px 20px;
      border: 1px dashed #dcd8eb;
      border-radius: 16px;
      color: #77758a;
      background: #ffffffa8;
      text-align: center;
      line-height: 1.6;
    }

    .error { color: #b8324a; }

    @media (max-width: 600px) {
      .page { padding: 32px 16px 48px; }
      header { align-items: flex-start; }
      .header-actions { flex-direction: column; align-items: stretch; }
      .nav-link { padding: 9px 11px; text-align: center; font-size: .82rem; }
      .plan-form { grid-template-columns: 1fr; padding: 19px; }
      .description-field, .submit { grid-column: auto; }
      .plan-card { gap: 10px; padding: 15px 13px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">Những điều muốn cùng nhau làm</p>
        <h1>Dự định tương lai</h1>
        <p class="subtitle">Ghi lại những kế hoạch phía trước, chọn ngày dự kiến và đánh dấu khi đã thực hiện.</p>
      </div>
      <nav class="header-actions" aria-label="Điều hướng">
        <a class="nav-link" href="ky-niem.html">Album kỷ niệm</a>
        <a class="nav-link primary" href="index.html.html">Đăng xuất</a>
      </nav>
    </header>

    <form class="plan-form" id="plan-form">
      <div class="field">
        <label for="plan-title">Dự định</label>
        <input id="plan-title" name="title" type="text" maxlength="100"
          placeholder="Ví dụ: Cùng đi ngắm biển" required>
      </div>
      <div class="field">
        <label for="plan-date">Ngày dự kiến</label>
        <input id="plan-date" name="date" type="date">
      </div>
      <div class="field description-field">
        <label for="plan-notes">Ghi chú</label>
        <textarea id="plan-notes" name="notes" maxlength="1000"
          placeholder="Thêm địa điểm, ý tưởng hoặc điều cần chuẩn bị..."></textarea>
      </div>
      <button class="submit" type="submit">Lưu dự định</button>
    </form>

    <section aria-labelledby="plans-heading">
      <div class="plans-heading">
        <h2 id="plans-heading">Danh sách dự định</h2>
        <span class="count" id="plan-count"></span>
      </div>
      <div class="plan-list" id="plan-list" aria-live="polite">
        <p class="empty">Đang tải dự định...</p>
      </div>
    </section>
  </main>

  <script>
    const DB_NAME = "memory-gallery";
    const STORE_NAME = "future-plans";
    const form = document.querySelector("#plan-form");
    const titleInput = document.querySelector("#plan-title");
    const dateInput = document.querySelector("#plan-date");
    const notesInput = document.querySelector("#plan-notes");
    const list = document.querySelector("#plan-list");
    const count = document.querySelector("#plan-count");
    let database;

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 2);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains("memories")) {
            request.result.createObjectStore("memories", { keyPath: "id" });
          }
          if (!request.result.objectStoreNames.contains(STORE_NAME)) {
            request.result.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
          }
        };
        request.onsuccess = () => {
          request.result.onversionchange = () => request.result.close();
          resolve(request.result);
        };
        request.onerror = () => reject(request.error);
        request.onblocked = () => reject(new Error("Đóng các tab album đang mở rồi tải lại trang này."));
      });
    }

    function getPlans() {
      return new Promise((resolve, reject) => {
        const request = database.transaction(STORE_NAME).objectStore(STORE_NAME).getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function savePlan(plan) {
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(STORE_NAME, "readwrite");
        transaction.objectStore(STORE_NAME).add(plan);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error || new Error("Không thể lưu dự định."));
      });
    }

    function updatePlan(plan) {
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(STORE_NAME, "readwrite");
        transaction.objectStore(STORE_NAME).put(plan);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error || new Error("Không thể cập nhật dự định."));
      });
    }

    function deletePlan(id) {
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(STORE_NAME, "readwrite");
        transaction.objectStore(STORE_NAME).delete(id);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error || new Error("Không thể xóa dự định."));
      });
    }

    function formatDate(value) {
      if (!value) return "Chưa chọn ngày";
      const [year, month, day] = value.split("-");
      return `${day}/${month}/${year}`;
    }

    async function renderPlans() {
      const plans = await getPlans();
      plans.sort((a, b) => {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        if (!a.date) return b.date ? 1 : a.id - b.id;
        if (!b.date) return -1;
        return a.date.localeCompare(b.date) || a.id - b.id;
      });
      list.replaceChildren();
      count.textContent = `${plans.length} dự định`;

      if (plans.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Chưa có dự định nào. Hãy lưu kế hoạch đầu tiên của bạn nhé.";
        list.append(empty);
        return;
      }

      plans.forEach(plan => {
        const card = document.createElement("article");
        card.className = `plan-card${plan.completed ? " completed" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.className = "plan-check";
        checkbox.type = "checkbox";
        checkbox.checked = Boolean(plan.completed);
        checkbox.setAttribute("aria-label", `Đánh dấu hoàn thành: ${plan.title}`);
        checkbox.addEventListener("change", async () => {
          try {
            await updatePlan({ ...plan, completed: checkbox.checked });
            await renderPlans();
          } catch (error) {
            checkbox.checked = !checkbox.checked;
            showError(error);
          }
        });

        const content = document.createElement("div");
        const title = document.createElement("h3");
        title.className = "plan-title";
        title.textContent = plan.title;
        const date = document.createElement("span");
        date.className = "plan-date";
        date.textContent = formatDate(plan.date);
        content.append(title, date);
        if (plan.notes) {
          const notes = document.createElement("p");
          notes.className = "plan-notes";
          notes.textContent = plan.notes;
          content.append(notes);
        }

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.type = "button";
        remove.textContent = "Xóa";
        remove.setAttribute("aria-label", `Xóa dự định: ${plan.title}`);
        remove.addEventListener("click", async () => {
          try {
            await deletePlan(plan.id);
            await renderPlans();
          } catch (error) {
            showError(error);
          }
        });

        card.append(checkbox, content, remove);
        list.append(card);
      });
    }

    function showError(error) {
      const message = document.createElement("p");
      message.className = "error";
      message.textContent = "Không thể tải hoặc cập nhật dự định. Hãy thử tải lại trang.";
      list.replaceChildren(message);
      console.error("Lỗi danh sách dự định:", error);
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      try {
        await savePlan({
          title: titleInput.value.trim(),
          date: dateInput.value,
          notes: notesInput.value.trim(),
          completed: false
        });
        form.reset();
        await renderPlans();
      } catch (error) {
        showError(error);
      }
    });

    openDatabase()
      .then(async result => {
        database = result;
        await renderPlans();
      })
      .catch(error => showError(error));
  </script>
</body>
</html>
